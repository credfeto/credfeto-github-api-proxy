---
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "03:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 99
    assignees:
      - credfeto
    commit-message:
      prefix: "[Dependencies]"
    labels:
      - "npm"
      - "dependencies"
      - "Changelog Not Required"
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: all
    groups:
      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
      vitest-security:
        applies-to: security-updates
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
      time: "03:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 99
    assignees:
      - credfeto
    commit-message:
      prefix: "[Dependencies]"
    labels:
      - "docker"
      - "dependencies"
      - "Changelog Not Required"
    allow:
      - dependency-type: all

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "03:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 99
    assignees:
      - credfeto
    commit-message:
      prefix: "[Dependencies]"
    labels:
      - "github-actions"
      - "dependencies"
      - "Changelog Not Required"
    allow:
      - dependency-type: all
