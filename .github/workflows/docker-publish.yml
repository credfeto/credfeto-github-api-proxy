--- # Docker: Build and Push
name: "Docker: Build and Push"

on:
  push:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: "Build (other branches)"
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/')
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Build and push to main registry"
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: |
            docker-registry.markridgwell.com/credfeto/github-api-proxy:latest
            docker-registry.markridgwell.com/credfeto/github-api-proxy:${{github.sha}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Build and push to release registry"
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: |
            release-docker-registry.markridgwell.com/credfeto/github-api-proxy:latest
            release-docker-registry.markridgwell.com/credfeto/github-api-proxy:${{github.sha}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
